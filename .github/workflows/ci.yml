name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Analyse & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Installer Melos
        run: dart pub global activate melos

      - name: Bootstrap du workspace
        run: melos bootstrap

      - name: Vérifier le formatage
        run: melos run format

      - name: Analyse statique
        run: melos run analyze

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances Python du benchmark
        run: pip install -r bench/requirements.txt

      - name: Générer le corpus de benchmark (déterministe)
        run: python bench/generate_corpus.py --n 1000 --seed 42 --out bench/corpus.jsonl

      - name: Tests
        run: melos run test
