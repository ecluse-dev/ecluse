name: ecluse_redact
description: >-
  Pseudonymisation réversible pour Écluse — masque les entités personnelles
  avant l'envoi à un LLM et restaure les valeurs réelles dans la réponse.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  ecluse_core:
    path: ../ecluse_core

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
