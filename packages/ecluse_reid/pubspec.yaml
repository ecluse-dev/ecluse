name: ecluse_reid
description: >-
  Boucle de ré-identification (Jalon 3) — estime la taille de la classe
  d'équivalence d'une combinaison de quasi-identifiants (profession de santé,
  lieu, âge) et suggère une généralisation, sur données publiques françaises.
  Dart pur, consomme ecluse_reference.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  ecluse_reference:
    path: ../ecluse_reference

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
