name: ecluse_demo
description: >-
  Interface de démonstration d'Écluse : le trajet complet redact → LLM →
  restore, en direct dans le navigateur.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  ecluse_core:
    path: ../ecluse_core
  ecluse_ingest:
    path: ../ecluse_ingest
  ecluse_redact:
    path: ../ecluse_redact
  ecluse_reference:
    path: ../ecluse_reference
  http: ^1.2.0
  shelf: ^1.4.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
